<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>Pose Lab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font: 12px/1.4 ui-monospace, monospace; color: #ddd; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #panel { position: fixed; top: 8px; left: 8px; background: rgba(0,0,0,.6); padding: 8px; border-radius: 6px; z-index: 2; display: flex; flex-direction: column; gap: 4px; min-width: 260px; }
  #panel select, #panel input, #panel button { font: inherit; }
  #info { white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <label>角色 <select id="char"></select></label>
  <label>動作 <select id="clip"></select></label>
  <label><input type="range" id="scrub" min="0" max="1" step="0.001" value="0" style="width:240px"></label>
  <div><button id="play">播放</button> <button id="loop">循環</button> <label><input type="checkbox" id="step" checked> 逐格</label> <label>速度 <select id="spd"><option>1</option><option>0.5</option><option>0.25</option><option>0.1</option></select></label></div>
  <label><input type="checkbox" id="run"> 跑步</label>
  <div id="info"></div>
</div>
<script type="module" src="./pose-test.js"></script>
</body>
</html>
